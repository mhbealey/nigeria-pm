name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wapa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://test:test@localhost:5432/wapa_test
      REDIS_URL: redis://localhost:6379
      WHATSAPP_API_VERSION: v21.0
      WHATSAPP_PHONE_NUMBER_ID: test-id
      WHATSAPP_BUSINESS_ACCOUNT_ID: test-biz-id
      WHATSAPP_ACCESS_TOKEN: test-token
      WHATSAPP_VERIFY_TOKEN: test-verify
      WHATSAPP_APP_SECRET: test-secret
      ANTHROPIC_API_KEY: test-key

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wapa/package-lock.json

      - name: Install dependencies
        working-directory: wapa
        run: npm ci

      - name: Lint
        working-directory: wapa
        run: npm run lint

      - name: Type check
        working-directory: wapa
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: wapa
        run: npm test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: wapa/coverage/
