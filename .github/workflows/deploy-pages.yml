name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/build-wapa-pm-nWPXO, main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wapa/web/package-lock.json

      - name: Install dependencies
        working-directory: wapa/web
        run: npm ci

      - name: Build
        working-directory: wapa/web
        run: npm run build

      - name: Add 404.html for SPA routing
        run: cp wapa/web/dist/index.html wapa/web/dist/404.html

      - name: Enable GitHub Pages
        run: |
          # Enable Pages with GitHub Actions source
          response=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"build_type":"workflow"}')
          code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "Status: $code"
          echo "Response: $body"
          # 201=created, 409=already exists, 422=already enabled — all OK
          if [ "$code" = "201" ] || [ "$code" = "409" ] || [ "$code" = "422" ]; then
            echo "Pages enabled successfully"
          else
            echo "::warning::Pages API returned $code — may need manual enablement"
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wapa/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
