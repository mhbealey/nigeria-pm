name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/build-wapa-pm-nWPXO, main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: wapa/web/package-lock.json

      - name: Install dependencies
        working-directory: wapa/web
        run: npm ci

      - name: Build
        working-directory: wapa/web
        run: npm run build

      - name: Add 404.html for SPA routing
        run: cp wapa/web/dist/index.html wapa/web/dist/404.html

      - name: Add .nojekyll
        run: touch wapa/web/dist/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./wapa/web/dist

      - name: Enable GitHub Pages from gh-pages branch
        run: |
          # Try to enable Pages; ignore error if already enabled
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}' || \
          curl -sf -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"source":{"branch":"gh-pages","path":"/"}}'
        continue-on-error: true
